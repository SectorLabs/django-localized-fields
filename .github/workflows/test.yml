name: Verify

on:
  pull_request: {}
  push:
    branches:
      - master

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Analysis

    runs-on: ubuntu-latest

    container:
      image: public.ecr.aws/docker/library/python:3.8.20-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Python packages
        run: pip install --progress-bar off '.[analysis]'

      - name: Verify formatting / linting
        run: python setup.py verify

  run-tests:
    name: Run Tests (Python ${{ matrix.python-version }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.6"
            python-image: "3.6.15-bullseye"
          - python-version: "3.7"
            python-image: "3.7.17-bookworm"
          - python-version: "3.8"
            python-image: "3.8.20-bookworm"
          - python-version: "3.9"
            python-image: "3.9.25-bookworm"
          - python-version: "3.10"
            python-image: "3.10.22-bookworm"
          - python-version: "3.11"
            python-image: "3.11.17-bookworm"

    container:
      image: public.ecr.aws/docker/library/python:${{ matrix.python-image }}

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:12.22-bookworm
        env:
          POSTGRES_DB: "localizedfields"
          POSTGRES_USER: "localizedfields"
          POSTGRES_PASSWORD: "localizedfields"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install packages
        run: apt-get update && apt-get install -y --no-install-recommends libpq-dev build-essential

      - name: Install Python packages
        run: pip install --progress-bar off '.[test]'

      - name: Run tests
        shell: bash
        env:
          DATABASE_URL: "postgres://localizedfields:localizedfields@postgres:5432/localizedfields"
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: tox --listenvs | grep "^py${PYTHON_VERSION//./}-" | xargs -n 1 tox -e
