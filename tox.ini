[tox]
isolated_build = true
envlist =
    py37-dj{20,21,22,30,31,32}
    {py38,py39}-dj{22,30,31,32,40,41,42}
    py310-dj{32,40,41,42,50,51,52}
    py311-dj{41,42,50,51,52}
    py312-dj{42,50,51,52}
    py313-dj{51,52}
    py314-dj52

[testenv]
deps =
    dj20: Django~=2.0.0
    dj21: Django~=2.1.0
    dj22: Django~=2.2.0
    dj30: Django~=3.0.0
    dj31: Django~=3.1.0
    dj32: Django~=3.2.0
    dj40: Django~=4.0.0
    dj41: Django~=4.1.0
    dj42: Django~=4.2.0
    dj50: Django~=5.0.0
    dj51: Django~=5.1.0
    dj52: Django~=5.2.0
    dj{20,21,22,30,31}: django-bleach==2.0.0
    dj32: django-bleach==2.0.0; python_version < "3.8"
    dj{32,40,41,42,50,51,52}: django-bleach==3.1.0; python_version >= "3.8"
    .[dev]
    .[test]
setenv =
    DJANGO_SETTINGS_MODULE=settings
passenv = DATABASE_URL
commands = poe test
